name: Build Sioyek Window Helpers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build color helper
        shell: cmd
        run: >
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE
          sioyek\window-helper\color.cpp
          /Fe:sioyek-color.exe
          user32.lib dwmapi.lib
          /link /SUBSYSTEM:WINDOWS

      - name: Build maximize helper
        shell: cmd
        run: >
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE
          sioyek\window-helper\maximize.cpp
          /Fe:sioyek-maximize.exe
          user32.lib
          /link /SUBSYSTEM:WINDOWS

      - name: Build drag helper
        shell: cmd
        run: >
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE
          sioyek\window-helper\drag.cpp
          /Fe:sioyek-drag.exe
          user32.lib
          /link /SUBSYSTEM:WINDOWS

      - name: Build toggle maximize helper
        shell: cmd
        run: >
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE
          sioyek\window-helper\toggle-maximize.cpp
          /Fe:sioyek-toggle-maximize.exe
          user32.lib
          /link /SUBSYSTEM:WINDOWS

      - name: Upload color helper
        uses: actions/upload-artifact@v4
        with:
          name: sioyek-color
          path: sioyek-color.exe

      - name: Upload maximize helper
        uses: actions/upload-artifact@v4
        with:
          name: sioyek-maximize
          path: sioyek-maximize.exe

      - name: Upload drag helper
        uses: actions/upload-artifact@v4
        with:
          name: sioyek-drag
          path: sioyek-drag.exe

      - name: Upload toggle maximize helper
        uses: actions/upload-artifact@v4
        with:
          name: sioyek-toggle-maximize
          path: sioyek-toggle-maximize.exe
